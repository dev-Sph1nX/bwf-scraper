name: Scrape & Deploy

on:
  push:
    branches: [main] # tout push sur main redéploie (les commits data [skip ci] ne bouclent pas)
  schedule:
    # Cron HORAIRE, mais la mise à jour ne tourne pas toutes les heures : le
    # job "garde" ci-dessous (léger, ~30 s) décide à chaque passage si c'est
    # le bon moment. Objectif : pendant un tournoi, mettre à jour juste APRÈS
    # le dernier match du jour (l'Elo de forme doit intégrer les résultats du
    # jour avant les matchs du lendemain), qui tombe à des heures très
    # différentes selon le fuseau (Corée ~13 h UTC, Europe ~22 h, Amériques
    # parfois après minuit UTC) — un cron fixe ne peut pas suivre. Hors
    # tournoi, la garde reproduit l'ancien comportement : un run vers 22 h UTC.
    # Minute 17 et pas 0 : les crons à l'heure pile sont les plus retardés
    # (voire sautés) par GitHub Actions, la file y étant la plus chargée.
    - cron: "17 * * * *"
  workflow_dispatch: {} # bouton "Run workflow" manuel — bypasse la garde (run forcé)

# Un seul run à la fois
concurrency:
  group: bwf-update
  cancel-in-progress: false

permissions:
  contents: write # pour committer le dossier data/
  pages: write # pour publier sur GitHub Pages
  id-token: write

jobs:
  # Garde du cron horaire : checkout + node, PAS de npm install ni de
  # Playwright — le but est justement de pouvoir tourner 24 fois par jour pour
  # trois fois rien. tools/should-update.mjs lit les données committées
  # (calendrier, draws, run-log) et répond « faut-il mettre à jour
  # maintenant ? » dans la sortie `run`. Ne tourne QUE sur le cron : push et
  # workflow_dispatch déclenchent la mise à jour sans passer par la garde.
  garde:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decision.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: decision
        run: node tools/should-update.mjs

  update-and-deploy:
    # `needs` + condition : sur cron, on n'exécute le job lourd que si la
    # garde a dit oui ; sur push et workflow_dispatch la garde est "skipped"
    # (son `if` est faux) et on exécute sans condition — d'où le `!cancelled()`,
    # OBLIGATOIRE : sans fonction de statut dans le `if`, un job dont un
    # `needs` a été skipped est lui-même skipped, quoi que dise le reste de la
    # condition, et push/dispatch ne déploieraient plus jamais.
    needs: garde
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.garde.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dépendances du scraper + navigateur Chromium
      - run: npm install
      - run: npx playwright install --with-deps chromium

      # 1) Scrape incrémental de l'année courante (met à jour data/)
      - run: node run-update.mjs

      # 1b) Classement mondial officiel BWF (pour la comparaison Elo).
      # continue-on-error : le script tourne désormais (Chromium + au moins une
      # requête) à CHAQUE run quotidien, plus seulement 1 jour sur 7 comme avant
      # cette branche. Une erreur réseau (Cloudflare, timeout, 5xx) ne doit pas
      # bloquer build-data/le build web/le déploiement ni empêcher l'étape
      # "Commit data" de committer le travail du scraper du jour : le rattrapage
      # est déjà géré par le script lui-même (une publication absente est
      # reprise au run suivant), donc tolérer l'échec ici est sans danger pour
      # l'archive — alors qu'un blocage coûterait tout le déploiement.
      - run: node fetch-rankings.mjs
        continue-on-error: true

      # 1c) Cotes des bookmakers français (Betclic, Unibet, Winamax) : HTTP pur,
      # relevé append-only dans data/books/runs/ (committé par l'étape "Commit
      # data"). continue-on-error : un opérateur qui change son format ou nous
      # bloque ne doit pas coûter le déploiement — le relevé manquant du jour
      # est perdu, mais l'historique reste intact et le run suivant reprend.
      - run: node scrape-books.mjs
        continue-on-error: true

      # 1d) Cotes + point par point Flashscore (incrémental : chaque outil
      # reprend par fsId ce qui est déjà dans data/flashscore/, seuls les
      # NOUVEAUX matchs coûtent des requêtes — quelques dizaines par jour de
      # tournoi, zéro hors tournoi). C'est ce qui donne aux nouveaux résultats
      # leurs cotes de clôture et leur graphe point par point dès le lendemain.
      # continue-on-error : même logique que les cotes bookmakers — un raté
      # Flashscore ne doit pas coûter le déploiement, le run suivant reprend.
      - run: node tools/flashscore/backfill-odds.mjs
        continue-on-error: true
      - run: node tools/flashscore/backfill-points.mjs --skip-existing
        continue-on-error: true

      # 2) Génère les JSON statiques (Elo sur TOUTES les saisons présentes dans data/)
      - run: node build-data.mjs

      # 2b) Backtest : baselines, calibration, prévisibilité par discipline.
      # APRÈS build-data, impérativement : build-data.mjs fait un rm -rf de
      # web/public/data/ avant de régénérer, donc l'inverse effacerait ce rapport
      # et la page /fiabilite resterait vide.
      - run: node backtest.mjs --quiet

      # 3) Build de l'app React
      - name: Build web
        working-directory: web
        run: |
          npm install
          npm run build

      # 4) Re-commit le store data/ pour l'incrémental du prochain run
      - name: Commit data
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add data
          git commit -m "chore: maj données BWF [skip ci]" || echo "Rien à committer"
          git push || echo "Rien à pousser"

      # 5) Publie web/dist sur GitHub Pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
