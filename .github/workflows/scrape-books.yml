# Relevé fréquent des cotes bookmakers (Betclic, Unibet, Winamax).
#
# POURQUOI un workflow dédié, toutes les 2 heures : la référence du marché est
# la COTE DE CLÔTURE (la dernière cote avant le match) — indispensable pour
# mesurer la CLV (Closing Line Value). Le relevé quotidien de deploy.yml est
# bien trop espacé pour l'approcher ; ici on échantillonne l'évolution des
# cotes tout au long de la journée, à coût quasi nul (HTTP pur, ~1 min).
#
# Depuis 2026-08-03, ce workflow PUBLIE aussi le site : sans cela, les relevés
# s'accumulaient dans data/books/runs/ mais la liste affichée (/sante,
# books-report) restait figée jusqu'au build quotidien de deploy.yml — d'où des
# « relevés » invisibles pendant 24 h. On régénère donc les JSON (build-data +
# backtest) et on redéploie GitHub Pages à chaque passage.
name: Relevé cotes bookmakers

on:
  schedule:
    - cron: "0 */2 * * *" # toutes les 2 heures, pour approcher les cotes de clôture
  workflow_dispatch: {} # bouton "Run workflow" manuel

# MÊME groupe que deploy.yml : les deux workflows committent data/ et déploient
# Pages — les sérialiser évite les pushs concurrents et les déploiements qui se
# doublent (un artefact plus vieux qui finirait après un plus récent).
concurrency:
  group: bwf-update
  cancel-in-progress: false

permissions:
  contents: write # pour committer data/books/
  pages: write # pour publier sur GitHub Pages
  id-token: write

jobs:
  scrape-books:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm install SANS navigateurs Playwright : scrape-books.mjs est en HTTP
      # pur, mais build-data.mjs importe lib/odds.mjs qui importe le paquet
      # playwright (jamais lancé ici — pas de `npx playwright install`).
      - run: npm install

      # Le script écrit un relevé MÊME à zéro ligne (période creuse, opérateur
      # qui bloque) : le passage et ses erreurs restent visibles sur /sante.
      - run: node scrape-books.mjs

      # Commit du relevé. [skip ci] est OBLIGATOIRE : deploy.yml se déclenche
      # sur TOUT push sur main — sans lui, chaque relevé bi-horaire lancerait
      # un scrape complet en plus du déploiement fait ici.
      # Protection contre les pushs concurrents : pull --rebase + 3 tentatives.
      - name: Commit data/books
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add data/books
          if git diff --cached --quiet; then
            echo "Rien à committer (aucun relevé écrit)."
            exit 0
          fi
          git commit -m "chore: relevé cotes bookmakers [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Push réussi (tentative $i)."
              exit 0
            fi
            echo "Push refusé (tentative $i), on retente..."
            sleep 5
          done
          echo "Échec du push après 3 tentatives." >&2
          exit 1

      # Régénère les JSON servis par l'app (cotes fraîches incluses)…
      - run: node build-data.mjs

      # …puis le backtest, APRÈS build-data (qui fait un rm -rf de
      # web/public/data/ : l'ordre inverse effacerait backtest.json).
      - run: node backtest.mjs --quiet

      # Build de l'app React
      - name: Build web
        working-directory: web
        run: |
          npm install
          npm run build

      # Publie web/dist sur GitHub Pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
